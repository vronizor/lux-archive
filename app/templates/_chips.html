<span class="chips" data-roll="{{ r.id }}">{% for s in stages %}{% set st = stage_state(r, s) %}{% set tip = stage_label[s] ~ (': ' ~ scan_summary(r.picks, r.scans) if s == 'picked' else '') %}<button type="button" class="chip {{ st }} s-{{ s }}" data-stage="{{ s }}" data-state="{{ st }}" title="{{ tip }}" aria-label="{{ tip }}: {{ st }}">{{ stage_label[s][0] }}</button>{% endfor %}</span>
