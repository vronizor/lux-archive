<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ app_name }}</title>
{% block head %}{% endblock %}
<style>
  body { font-family: system-ui, sans-serif; background: #f3eee4; color: #2a2520; margin: 0; display: grid; place-items: center; min-height: 100vh; }
  @media (prefers-color-scheme: dark) { body { background: #0e0c0b; color: #d8d0c4; } }
  div { max-width: 26rem; padding: 2rem; text-align: center; line-height: 1.5; }
  h1 { font-size: 1.3rem; }
</style>
</head>
<body><div>{% block main %}{% endblock %}</div></body>
</html>
