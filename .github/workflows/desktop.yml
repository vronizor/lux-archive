name: Desktop builds

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["app/**", "desktop/**", "requirements*.txt", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: Lux-Archive-mac-apple-silicon
          - os: macos-15-intel
            asset: Lux-Archive-mac-intel
          - os: windows-latest
            asset: Lux-Archive-windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-desktop.txt
      - name: Stamp the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION = \"${GITHUB_REF_NAME}\"" > app/version.py
      - run: pyinstaller --noconfirm desktop/lux.spec
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        run: python desktop/smoke.py "dist/Lux Archive/Lux Archive.exe"
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: python desktop/smoke.py "dist/Lux Archive.app/Contents/MacOS/Lux Archive"
      - name: Double-click test (macOS)
        if: runner.os == 'macOS'
        run: |
          data="$RUNNER_TEMP/lux-open"
          open "dist/Lux Archive.app" --args --no-browser --port 8497 --data-dir "$data"
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8497/api/ping && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8497/api/ping
          sleep 2
          open "dist/Lux Archive.app"
          sleep 3
          cat "$data/lux.log"
          grep -q "menu bar icon ready" "$data/lux.log"
          grep -q "^reopen$" "$data/lux.log"
          test "$(grep -c '^launch ' "$data/lux.log")" = 1
          curl -sf -o /dev/null -X POST http://127.0.0.1:8497/desktop/quit
          sleep 3
          ! curl -sf http://127.0.0.1:8497/api/ping
          ! pgrep -f "Lux Archive.app/Contents/MacOS"
      - name: Tray log (Windows)
        if: runner.os == 'Windows'
        run: cat "$RUNNER_TEMP"/lux-smoke-log.txt || true
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/Lux Archive.app" "${{ matrix.asset }}.zip"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "dist/Lux Archive" -DestinationPath "${{ matrix.asset }}.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" *.zip --clobber
